name: Rin
options:
  bundleIdPrefix: com.zoro
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  Sparkle:
    path: Packages/Sparkle
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.6.3"
    CURRENT_PROJECT_VERSION: "11"
targets:
  Rin:
    type: application
    platform: macOS
    sources:
      - path: Rin
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoro.rin
        PRODUCT_NAME: Rin
        INFOPLIST_FILE: Rin/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rin/Support/Rin.entitlements
        # Empty except in release builds (scripts/release.sh), so only those can update themselves.
        RIN_UPDATE_FEED: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # On in release builds (scripts/release.sh): it refuses to load Sparkle with an ad-hoc signature.
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_OBJC_BRIDGING_HEADER: Rin/Support/Rin-Bridging-Header.h
        OTHER_LDFLAGS: ["-lIOReport"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
