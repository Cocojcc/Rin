name: Rin
options:
  bundleIdPrefix: com.zoro
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rin:
    type: application
    platform: macOS
    sources:
      - path: Rin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoro.rin
        PRODUCT_NAME: Rin
        INFOPLIST_FILE: Rin/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rin/Support/Rin.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Rin/Support/Rin-Bridging-Header.h
        OTHER_LDFLAGS: ["-lIOReport"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
